<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YuanChuangLabCN 原创实验室</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"微软雅黑",sans-serif}
        body{background:#0f172a;color:#e2e8f0;line-height:1.6}
        .container{max-width:1000px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:50px}
        h1{font-size:38px;color:#38bdf8;margin-bottom:12px}
        .slogan{font-size:20px;color:#94a3b8}
        .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:40px 0}
        .card{background:#1e293b;padding:24px;border-radius:12px;border:1px solid #334155;transition:0.3s}
        .card:hover{transform:translateY(-6px);border-color:#38bdf8}
        .card h3{color:#38bdf8;margin-bottom:8px}
        footer{text-align:center;margin-top:60px;color:#64748b;padding-top:20px;border-top:1px solid #334155}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>原创实验室 YuanChuangLabCN</h1>
            <p class="slogan">以原创构建未来</p>
        </header>
        <div class="cards">
            <div class="card"><h3>IT明白</h3><p>企业组网、全光WiFi、IT运维服务</p></div>
            <div class="card"><h3>原创视界</h3><p>影像记录、内容创作、品牌宣传</p></div>
            <div class="card"><h3>原创航天</h3><p>小卫星研发、空间通讯探索</p></div>
            <div class="card"><h3>原创海境</h3><p>水下通讯技术研究与开发</p></div>
        </div>
        <footer>分布式工作室 · 开源研发 + 商业落地双模式</footer>
    </div>
</body>
</html>
